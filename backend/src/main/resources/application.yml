spring:
  application:
    name: festival-waiting-service
  
  # 파일 기반의 H2 데이터베이스로 전환하여 영속성을 확보합니다.
  datasource:
    url: jdbc:h2:file:./data/festivaldb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 배포 서버 실제 주소 (QR코드 랜딩 등에 활용)
app:
  server-url: "http://18.226.75.182:8080"

# 외부 API 설정 (민감정보 노출 방지를 위해 환경변수 우선 적용)
api:
  tour:
    service-key: "${TOUR_SERVICE_KEY:6216caee7398fb49a11eb001670c71522f94f181cb824b46b05ba330f00cd406}"
  kakao:
    # 백엔드 주소 변환(Local REST API)에 사용할 REST API 키
    rest-api-key: "${KAKAO_REST_API_KEY:9686c41f5bd9c4e7632c3f33d5d6c509}"
    # 프론트엔드 지도 렌더링에 사용할 JavaScript 키
    js-key: "${KAKAO_JS_KEY:afc128520ee0ba1a8488402ad3ebbbe0}"
  solapi:
    # Solapi API Key
    api-key: "${SOLAPI_API_KEY:NCSEMUXFI1QKUN0O}"
    # Solapi API Secret
    api-secret: "${SOLAPI_API_SECRET:IX1ESTZPLHVSIP6HL7STNCB8XCIMZ0Q1}"
    # Solapi 발신번호 (솔라피 콘솔에 등록 및 인증 완료된 본인의 발신번호를 입력하세요, 예: 01012345678)
    sender-number: ""
    # 실제 SMS/알림톡 발송 기능 활성화 여부
    enabled: false

# JWT 보안 키 설정 (HS512 알고리즘 사용을 위해 최소 64자 필수)
jwt:
  secret: "${JWT_SECRET:festival-waiting-2026-jwt-secret-key-must-be-at-least-64-characters-long-for-hs512}"

